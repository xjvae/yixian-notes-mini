[package]
name = "yixian-notes-mini"
version = "1.0.0"
description = "一闲笔记 mini — 桌面便签"
authors = ["梦一闲"]
edition = "2024"
rust-version = "1.97"

[lib]
name = "yixian_notes_mini_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon"] }
# 单实例：将来 WH_MOUSE_LL 钩子落地后，第二个进程绝不能再装一套钩子（互抢右键 = 两边都失灵）
tauri-plugin-single-instance = "2.4"
# 全局快捷键（Alt+1..4 直达；Alt+Space 唤星环随 M4）。逐条注册、逐条容忍失败
tauri-plugin-global-shortcut = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 私密层：Argon2id 派生密钥 + AES-256-GCM 封套（data/crypto.rs、data/private.rs）
argon2 = "0.5"
aes-gcm = "0.10"
base64 = "0.22"
zeroize = "1.8"
# bundled SQLite：与 TS 检索（FTS5 中文二字组，ROADMAP M2）共用一个编译单元
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Win32：monitor_work_area 取工作区（贴边细丝不压任务栏）+ WH_MOUSE_LL 长按右键钩子
# （吞 down + 阈值 + 补偿注入）+ 前台进程白名单采样（OpenProcess/QueryFullProcessImageNameW）
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

# 随 ROADMAP 加入：argon2/aes-gcm/base64/zeroize（私密层 M3）、
# windows crate（WH_MOUSE_LL 钩子 M4）、tauri-plugin-global-shortcut（M2）

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# panic=abort 省体积，但没有 unwind 兜底：所有锁都必须按 poison 可恢复来写
# （unwrap_or_else(|p| p.into_inner())），否则一次 panic 之后每次取锁都是 PoisonError。
panic = "abort"
incremental = false

[profile.dev]
opt-level = 1
debug = true
incremental = true
